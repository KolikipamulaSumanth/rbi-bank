name: rbibank

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: rbibankdb
      MYSQL_ROOT_PASSWORD: Ksumanth@999
    volumes:
      - rbibank-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: rbibank-app
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/rbibankdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Ksumanth@999
    ports:
      - "8080:8080"

volumes:
  rbibank-mysql-data:
